<header class="site-header"><div class="brand">{{brand}}</div></header>
<main class="shell options-shell">
<div class="page-heading"><h1>{{options_heading}}</h1></div>
<div class="context">{{selected_item}}</div>
<div class="options-grid">
<section class="panel delivery-panel"><h2>{{delivery_heading}}</h2>{{standard}}{{express}}</section>
<section class="panel other-options"><h2>{{extras_heading}}</h2><p class="muted">{{options_notice}}</p>{{case}}{{membership}}</section>
</div>
<section class="protection-band">
<div class="protection-choice">{{protection}}</div>
<div class="proceed">{{continue}}</div>
</section>
<nav class="actions options-back">{{back}}</nav>
</main>
