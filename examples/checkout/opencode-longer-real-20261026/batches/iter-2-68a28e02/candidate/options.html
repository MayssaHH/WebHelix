<header class="site-header"><div class="brand">{{brand}}</div></header>
<main class="shell continuity-shell">
<div class="page-heading"><h1>{{options_heading}}</h1></div>
<div class="context">{{selected_item}}</div>
<div class="continuity-grid">
<section class="panel primary-route">
<h2>{{delivery_heading}}</h2>
{{standard}}
<section class="service-step">
<h2>{{extras_heading}}</h2>
<p class="muted">{{options_notice}}</p>
{{protection}}
</section>
<div class="route-next">{{continue}}</div>
</section>
<section class="panel secondary-route">
<h2>{{delivery_heading}}</h2>
{{express}}
<h2>{{extras_heading}}</h2>
{{case}}
{{membership}}
</section>
</div>
<nav class="actions">{{back}}</nav>
</main>
