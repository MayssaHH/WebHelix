<header class="site-header"><div class="brand">{{brand}}</div></header>
<main class="shell action-options">
<div class="page-heading"><h1>{{options_heading}}</h1></div>
<div class="context">{{selected_item}}</div>
<section class="panel delivery-strip"><h2>{{delivery_heading}}</h2><div class="delivery-choices">{{standard}}{{express}}</div></section>
<section class="extras-section"><h2>{{extras_heading}}</h2><p class="muted">{{options_notice}}</p><div class="secondary-extras">{{case}}{{membership}}</div></section>
<div class="checkout-area"><div class="protection-action">{{protection}}</div><nav class="actions">{{back}}{{continue}}</nav></div>
</main>
