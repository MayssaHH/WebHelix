<header class="site-header"><div class="brand">{{brand}}</div><span class="site-note">{{simulation_notice}}</span></header>
<main class="shell"><div class="page-heading"><span class="eyebrow">{{product_heading}}</span><h1>{{product_name}}</h1></div><section class="product-grid"><div class="product-art"><div class="headband"></div><div class="ear-left"></div><div class="ear-right"></div></div><article class="panel product-info">{{product_description}}<div class="price">{{product_price}}</div><div class="actions">{{add}}</div></article></section><aside class="case-banner"><div class="case-icon"></div><div><h2>{{extras_heading}}</h2><div class="case-fact">{{case_fact}}</div><p>{{options_notice}}</p></div></aside><footer class="footnote">{{standard_fact}}</footer></main>
