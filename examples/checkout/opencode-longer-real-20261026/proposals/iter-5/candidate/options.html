<header class="site-header"><div class="brand">{{brand}}</div></header>
<main class="shell sequential-shell">
<div class="page-heading"><h1>{{options_heading}}</h1></div>
<div class="context">{{selected_item}}</div>
<section class="case-stage">
<div class="stage-copy"><h2>{{extras_heading}}</h2><p>{{options_notice}}</p>{{case}}</div>
<div class="travel-art"><div class="travel-handle"></div><div class="travel-case"><div class="travel-seam"></div></div></div>
</section>
<section class="panel delivery-stage"><h2>{{delivery_heading}}</h2>{{standard}}{{express}}</section>
<section class="panel remaining-stage"><h2>{{extras_heading}}</h2>{{protection}}{{membership}}</section>
<nav class="actions">{{back}}{{continue}}</nav>
</main>
