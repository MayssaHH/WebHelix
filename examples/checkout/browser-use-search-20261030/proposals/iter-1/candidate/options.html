<header class="site-header"><div class="brand">{{brand}}</div></header>
<main class="shell option-stage">
<div class="page-heading"><h1>{{options_heading}}</h1></div>
<div class="context">{{selected_item}}</div>
<div class="choice-layout">
<section class="panel delivery-panel"><h2>{{delivery_heading}}</h2>{{standard}}{{express}}</section>
<section class="case-feature"><h2>{{extras_heading}}</h2><p>{{options_notice}}</p><div class="case-art"><div class="case-handle"></div><div class="case-body"></div></div><div class="case-select">{{case}}</div></section>
</div>
<div class="other-options">{{protection}}{{membership}}</div>
<nav class="actions">{{back}}{{continue}}</nav>
</main>
