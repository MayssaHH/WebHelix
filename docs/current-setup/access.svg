<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc">
<title id="title">Who sees what in WebHelix</title><desc id="desc">Separate optimizer and victim inputs. The optimizer edits a candidate, fixed local code renders it, and the victim observes and acts through a browser. Protected validation and evaluation inspect the resulting evidence.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526779"/></marker></defs>
<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#15324f}.title{font-weight:700}.small{fill:#526779}</style>
<rect x="1" y="1" width="998" height="48" rx="9" fill="#15324f"/>
<text x="500" y="32" text-anchor="middle" font-size="23" style="fill:white;font-weight:700">AutoHelix + WebHelix orchestrate the experiment</text>
<rect x="1" y="75" width="440" height="235" rx="10" fill="#eff6fc" stroke="#23629b" stroke-width="1.8"/>
<text x="19" y="106" class="title" font-size="22">OPTIMIZER · OpenCode + Sol</text>
<text x="19" y="135" font-size="20">Search goal + legitimate user task</text>
<text x="19" y="162" font-size="20">Candidate files + editing contract</text>
<text x="19" y="189" font-size="20">Catalogue + evaluation reference</text>
<text x="19" y="216" font-size="20">Prior notes, metrics + full evidence</text>
<text x="19" y="243" font-size="20">Scripted preview observations</text>
<rect x="559" y="75" width="440" height="235" rx="10" fill="#f5f1fa" stroke="#7046a3" stroke-width="1.8"/>
<text x="577" y="106" class="title" font-size="22">VICTIM · Browser-Use + Luna</text>
<text x="577" y="135" font-size="20">Legitimate user task</text>
<text x="577" y="162" font-size="20">Native DOM + actual screenshots</text>
<text x="577" y="189" font-size="20">Own fresh-session history</text>
<text x="577" y="216" font-size="20">Browser tools: click, scroll, etc.</text>
<text x="577" y="243" font-size="20">No optimizer notes or score labels</text>
<path d="M 155 310 V 363" fill="none" stroke="#23629b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="175" y="341" font-size="19" fill="#23629b" text-anchor="start">edit</text>
<path d="M 779 317 V 340 H 500 V 363" fill="none" stroke="#7046a3" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="620" y="333" font-size="19" fill="#7046a3" text-anchor="start">observe / act</text>
<rect x="1" y="370" width="298" height="94" rx="10" fill="#eff6fc" stroke="#23629b" stroke-width="1.8"/>
<text x="19" y="401" class="title" font-size="22">CANDIDATE</text>
<text x="19" y="430" font-size="20">Five editable files</text>
<rect x="351" y="370" width="298" height="94" rx="10" fill="#edf7f3" stroke="#197568" stroke-width="1.8"/>
<text x="369" y="401" class="title" font-size="22">LOCAL ARENA COPY</text>
<text x="369" y="430" font-size="20">Fixed replay + cart</text>
<rect x="701" y="370" width="298" height="94" rx="10" fill="#f2f4f7" stroke="#15324f" stroke-width="1.8"/>
<text x="719" y="401" class="title" font-size="22">PROTECTED CHECKS</text>
<text x="719" y="430" font-size="20">Validate + evaluate</text>
<path d="M 301 416 H 345" fill="none" stroke="#526779" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 651 416 H 695" fill="none" stroke="#526779" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="500" y="486" font-size="18" fill="#526779" text-anchor="middle">Task and browser observations reach the victim; optimizer research context does not.</text>
</svg>
