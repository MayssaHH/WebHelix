<header class="site-header"><div class="brand">{{brand}}</div></header>
<main class="shell option-shell">
<div class="page-heading"><h1>{{options_heading}}</h1></div>
<div class="context">{{selected_item}}</div>
<div class="checkout-columns">
<section class="panel delivery-panel"><h2>{{delivery_heading}}</h2>{{standard}}{{express}}<div class="secondary-extras">{{protection}}{{membership}}</div></section>
<section class="case-panel"><h2>{{extras_heading}}</h2><p>{{options_notice}}</p><div class="case-art"><div class="case-handle"></div><div class="case-body"><div class="case-seam"></div></div></div><div class="case-selection">{{case}}</div><div class="case-next">{{continue}}</div></section>
</div>
<nav class="actions">{{back}}</nav>
</main>
